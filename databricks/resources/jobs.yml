resources:
  jobs:
    bootstrap_unity_catalog_job:
      name: "bootstrap-unity-catalog-${bundle.target}"
      tasks:
        - task_key: bootstrap_unity_catalog
          notebook_task:
            notebook_path: ../../notebooks/bootstrap_unity_catalog.sql
            base_parameters:
              catalog: ${var.catalog}

    consent_pipeline_job:
      name: "consent-pipeline-${bundle.target}"
      trigger:
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: bronze_autoloader
          notebook_task:
            notebook_path: ../../notebooks/bronze_autoloader.py
            base_parameters:
              catalog: ${var.catalog}
              raw_path: ${var.raw_path}
              checkpoint_base: ${var.checkpoint_base}

        - task_key: silver_consent_stream
          depends_on:
            - task_key: bronze_autoloader
          notebook_task:
            notebook_path: ../../notebooks/silver_consent_stream.py
            base_parameters:
              catalog: ${var.catalog}
              checkpoint_base: ${var.checkpoint_base}
              secret_scope: ${var.secret_scope}
              # Notebook faz "from src.common..." — o sync do bundle coloca
              # src/ no workspace, mas só ${workspace.file_path} no sys.path
              # torna esse import resolvível (ver comentário no notebook).
              bundle_root: ${workspace.file_path}

        - task_key: mongo_sink
          depends_on:
            - task_key: silver_consent_stream
          notebook_task:
            notebook_path: ../../notebooks/mongo_sink.py
            base_parameters:
              catalog: ${var.catalog}
              checkpoint_base: ${var.checkpoint_base}
              secret_scope: ${var.secret_scope}
              bundle_root: ${workspace.file_path}
          # Compute serverless (Free Edition) não aceita bibliotecas JVM/Maven
          # (por isso mongo_sink.py grava via pymongo, não via connector
          # Spark) — mas pymongo em si, sendo pip, precisa deste
          # environment_key para existir no notebook.
          environment_key: mongo_env

        - task_key: gold_metricas
          depends_on:
            - task_key: silver_consent_stream
          notebook_task:
            notebook_path: ../../notebooks/gold_metricas.py
            base_parameters:
              catalog: ${var.catalog}
              checkpoint_base: ${var.checkpoint_base}
              secret_scope: ${var.secret_scope}
          # Também espelha a Gold para o Mongo via pymongo — mesma
          # necessidade de environment_key que mongo_sink (ver comentário lá).
          environment_key: mongo_env

      # environment_key acima referencia este bloco: compute serverless só
      # aceita dependências extras (pip) desta forma — não há cluster
      # clássico aqui para anexar libraries do jeito tradicional.
      environments:
        - environment_key: mongo_env
          spec:
            # client "1" não é suportado pelo canal REPL deste workspace
            # (INVALID_PARAMETER_VALUE: "Workspace doesn't support Client-1
            # channel for REPL") — "2" é o canal serverless atual.
            client: "2"
            dependencies:
              - pymongo==4.9.1
