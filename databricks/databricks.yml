bundle:
  name: consent_pipeline

include:
  - resources/jobs.yml

variables:
  catalog:
    description: >-
      Catálogo Unity Catalog do ambiente. Free Edition normalmente permite
      só um catálogo por conta — se `CREATE CATALOG` falhar no bootstrap,
      use um único catálogo e troque esta variável para nomear schemas
      (ex.: dev_bronze/prod_bronze) em vez de catálogos.
  checkpoint_base:
    description: "Path dos checkpoints de streaming (Unity Catalog Volume). Vazio = notebook usa o Volume padrão do catálogo."
    default: ""
  raw_path:
    description: "Path dos CSVs de cadastro (Unity Catalog Volume). Vazio = notebook usa o Volume padrão do catálogo."
    default: ""
  secret_scope:
    description: Databricks secret scope nativo (criado via `databricks secrets create-scope`, sem depender de nenhum cloud provider)
    default: consent-pipeline

targets:
  dev:
    default: true
    # workspace.host/token vêm de $DATABRICKS_HOST / $DATABRICKS_TOKEN no
    # ambiente (CI ou shell local) — não hardcoded aqui. No Databricks Free
    # Edition uma conta = um workspace, então dev e prod apontam para o
    # mesmo host; a separação de ambiente é feita pelo catálogo.
    variables:
      catalog: consent_pipeline_dev

  prod:
    variables:
      catalog: consent_pipeline_prod
