name: CI/CD — Consent Pipeline

# 100% free tier, sem nenhuma conta cloud (Azure/AWS/GCP):
#   - Databricks Free Edition (workspace único, dev/prod separados por catálogo)
#   - Confluent Cloud (trial) para o Kafka
#   - MongoDB Atlas M0 para o Mongo
#   - Render.com faz o deploy da API sozinho (auto-deploy conectado ao repo,
#     não depende deste workflow — ver README)
#
# Terraform (infra/) provisiona só Confluent + MongoDB Atlas, e roda
# LOCALMENTE (não em CI): sem backend remoto, sem custo de hospedar state.
# O job terraform-check abaixo só valida formatação/sintaxe em PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Gitleaks (scan de segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest tests/ -v

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  deploy-databricks-dev:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Secret scope nativo (Kafka + Mongo, sem Key Vault)
        run: |
          databricks secrets create-scope consent-pipeline || echo "scope já existe, seguindo"
          databricks secrets put-secret consent-pipeline kafka-bootstrap --string-value "$KAFKA_BOOTSTRAP_SERVERS"
          databricks secrets put-secret consent-pipeline kafka-api-key --string-value "$KAFKA_API_KEY"
          databricks secrets put-secret consent-pipeline kafka-api-secret --string-value "$KAFKA_API_SECRET"
          databricks secrets put-secret consent-pipeline mongo-uri --string-value "$MONGO_URI"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_API_KEY: ${{ secrets.KAFKA_API_KEY }}
          KAFKA_API_SECRET: ${{ secrets.KAFKA_API_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
      - name: Deploy Databricks Asset Bundle (dev)
        working-directory: databricks
        run: databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Bootstrap Unity Catalog (catálogos/schemas/volumes + governança)
        working-directory: databricks
        run: databricks bundle run bootstrap_unity_catalog_job --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-databricks-prod:
    needs: deploy-databricks-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Ambiente "prod" no GitHub configurado com required reviewers —
    # promoção dev->prod exige aprovação manual antes de aplicar.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy Databricks Asset Bundle (prod)
        working-directory: databricks
        run: databricks bundle deploy --target prod
        env:
          # Free Edition = um workspace só; se você tiver uma segunda conta
          # Databricks para "prod" de verdade, troque este secret pelo host
          # dela (DATABRICKS_HOST_PROD / DATABRICKS_TOKEN_PROD).
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Bootstrap Unity Catalog (catálogos/schemas/volumes + governança)
        working-directory: databricks
        run: databricks bundle run bootstrap_unity_catalog_job --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
