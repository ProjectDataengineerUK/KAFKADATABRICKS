name: CI/CD — Consent Pipeline

# Nota: o DESIGN cita Azure DevOps como opção de CI/CD; como o repositório é
# público no GitHub (decisão do DEFINE, visibilidade de portfólio), a
# implementação usa GitHub Actions — mesmo fluxo (lint/test -> terraform
# plan/apply -> deploy DAB -> promoção dev->prod), nativo do GitHub e visível
# no perfil/README sem serviço externo adicional.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Gitleaks (scan de segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest tests/ -v

  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="key=dev.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -var="kafka_bootstrap_servers=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
            -var="kafka_api_key=${{ secrets.KAFKA_API_KEY }}" \
            -var="kafka_api_secret=${{ secrets.KAFKA_API_SECRET }}" \
            -var="mongo_uri=${{ secrets.MONGO_URI }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  deploy-dev:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="key=dev.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - run: |
          terraform apply -auto-approve \
            -var-file=environments/dev.tfvars \
            -var="kafka_bootstrap_servers=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
            -var="kafka_api_key=${{ secrets.KAFKA_API_KEY }}" \
            -var="kafka_api_secret=${{ secrets.KAFKA_API_SECRET }}" \
            -var="mongo_uri=${{ secrets.MONGO_URI }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Deploy Databricks Asset Bundle (dev)
        working-directory: databricks
        run: |
          pip install databricks-cli
          databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST_DEV: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}

  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Ambiente "prod" no GitHub configurado com required reviewers —
    # promoção dev->prod exige aprovação manual antes de aplicar.
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="key=prod.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - run: |
          terraform apply -auto-approve \
            -var-file=environments/prod.tfvars \
            -var="kafka_bootstrap_servers=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
            -var="kafka_api_key=${{ secrets.KAFKA_API_KEY }}" \
            -var="kafka_api_secret=${{ secrets.KAFKA_API_SECRET }}" \
            -var="mongo_uri=${{ secrets.MONGO_URI }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Deploy Databricks Asset Bundle (prod)
        working-directory: databricks
        run: |
          pip install databricks-cli
          databricks bundle deploy --target prod
        env:
          DATABRICKS_HOST_PROD: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
